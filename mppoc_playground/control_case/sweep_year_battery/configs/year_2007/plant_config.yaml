name: plant_config
description: This plant is located in Texas, USA.
sites:
  site:
    latitude: 34.382308
    longitude: -101.816607
    resources:
      wind_resource:
        resource_model: WTKNLRDeveloperAPIWindResource
        resource_parameters:
          resource_year: 2007
          resource_dir: ../resources
      solar_resource:
        resource_model: GOESAggregatedSolarAPI
        resource_parameters:
          resource_year: 2007
          resource_dir: ../resources
technology_interconnections:
- - ng_feedstock
  - natural_gas_plant
  - natural_gas
  - pipe
- - solar
  - renew_combiner
  - electricity
  - cable
- - wind
  - renew_combiner
  - electricity
  - cable
- - renew_combiner
  - supply_combiner
  - electricity
  - cable
- - natural_gas_plant
  - supply_combiner
  - electricity
  - cable
- - supply_combiner
  - battery
  - electricity
  - cable
- - supply_combiner
  - combiner
  - electricity
  - cable
- - battery
  - combiner
  - electricity
  - cable
- - combiner
  - electrical_load_demand
  - electricity
  - cable
resource_to_tech_connections:
- - site.wind_resource
  - wind
  - wind_resource_data
- - site.solar_resource
  - solar
  - solar_resource_data
plant:
  plant_life: 30
  simulation:
    n_timesteps: 8760
    dt: 3600
system_level_control:
  control_strategy: DispatchableFirstControl
  solver_options:
    solver_name: gauss_seidel
    max_iter: 20
    convergence_tolerance: 1.0e-06
finance_parameters:
  finance_groups:
    profast_lco:
      finance_model: ProFastLCO
      model_inputs:
        params: &id001
          analysis_start_year: 2032
          installation_time: 36
          inflation_rate: 0.0
          discount_rate: 0.09
          debt_equity_ratio: 2.62
          property_tax_and_insurance: 0.03
          total_income_tax_rate: 0.257
          capital_gains_tax_rate: 0.15
          sales_tax_rate: 0.07375
          debt_interest_rate: 0.07
          debt_type: Revolving debt
          loan_period_if_used: 0
          cash_onhand_months: 1
          admin_expense: 0.0
        capital_items:
          depr_type: MACRS
          depr_period: 5
          refurb:
          - 0.0
    profast_npv:
      finance_model: ProFastNPV
      model_inputs:
        commodity_sell_price: 0.0
        commodity_sell_price_units: USD/(kW*h)
        params: *id001
        capital_items:
          depr_type: MACRS
          depr_period: 5
          refurb:
          - 0.0
  finance_subgroups:
    renewable_generation:
      commodity: electricity
      commodity_stream: renew_combiner
      finance_groups:
      - profast_lco
      - profast_npv
      technologies:
      - solar
      - wind
    natural_gas:
      commodity: electricity
      commodity_stream: natural_gas_plant
      finance_groups:
      - profast_lco
      - profast_npv
      technologies:
      - natural_gas_plant
      - ng_feedstock
    electricity:
      commodity: electricity
      commodity_stream: combiner
      finance_groups: profast_lco
      technologies:
      - solar
      - wind
      - battery
      - natural_gas_plant
      - ng_feedstock
  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025
    target_dollar_year: 2022
