name: plant_config
description: This plant is located in Texas, USA.
sites:
  site:
    latitude: 34.382308
    longitude: -101.816607
    resources:
      # wind_resource:
      #   resource_model: OpenMeteoHistoricalWindResource
      #   resource_parameters:
      #     resource_year: 2024
      solar_resource:
        # resource_model: OpenMeteoHistoricalSolarResource
        resource_model: PVLibClearSkyResource
        resource_model_location: /Users/ztully/Documents/software/MPPOC/mppoc_playground/mppoc_playground/openmeteo_data/h2i_clearsky/pvlib_clearsky.py        
        resource_parameters:
          resource_year: 2024
# array of arrays containing left-to-right technology
# interconnections; can support bidirectional connections
# with the reverse definition.
# this will naturally grow as we mature the interconnected tech
technology_interconnections:
  # connect solar to battery
  - [solar, battery, electricity, cable]
  # combine solar and battery output
  - [solar, bat_combiner, electricity, cable]
  - [battery, bat_combiner, electricity, cable]
  # subtract variable generation from the demand
  - [bat_combiner, electrical_load_demand, electricity, cable]

  # # connect remaining demand to grid buying
  # - [electrical_load_demand, grid_buy, [unmet_electricity_demand_out, electricity_set_point]]
  # # connect surplus generation to grid selling
  # - [electrical_load_demand, grid_sell, [unused_electricity_out, electricity_in]]
  # # combine electricity generated from solar+battery and electricity bought from grid
  # - [bat_combiner, combiner, electricity, cable]
  # - [grid_buy, combiner, electricity, cable]


  # # Physical plant: wind + solar are combined and used to run a single electrolyzer.
  # # This same physical plant is financed three different ways below (see finance_subgroups).
  # - [wind, combiner, electricity, cable]
  # - [solar, combiner, electricity, cable]
  # - [combiner, electrolyzer, electricity, cable]

  # # --- Approach B wiring: upstream LCOE used as a feedstock price --------------
  # # Compute the wind + solar levelized cost of electricity (LCOE) in the
  # # `electricity` finance subgroup, then charge the electrolyzer for the
  # # electricity it consumes at that LCOE through the `electricity_feedstock` tech.
  # #
  # # 1. Feed the computed LCOE in as the feedstock purchase price (scalar slice):
  # - [finance_subgroup_electricity, electricity_feedstock, [LCOE, price]]
  # # 2. Charge the feedstock for exactly the electricity the electrolyzer consumes:
  # - [electrolyzer, electricity_feedstock, electricity_consumed]
  # # 3. Provide the feedstock supply profile (used for its capacity factor):
  # - [electricity_feedstock_source, electricity_feedstock, electricity_out]

  # # --- Approach C wiring: upstream LCOE used as a grid purchase price ----------
  # # Same idea as Approach B, but the electricity is "purchased" through a
  # # `grid_buy` interconnection priced at the LCOE instead of a generic feedstock.
  # #
  # # 1. Feed the computed LCOE in as the grid buy price (scalar tiled to 8760 h):
  # - [finance_subgroup_electricity, grid_buy, ['LCOE[0]', 'electricity_buy_price[0:8760]']]
  # # 2. Buy from the grid exactly the electricity the electrolyzer consumes:
  # - [electrolyzer, grid_buy, [electricity_consumed, electricity_set_point]]
resource_to_tech_connections:
  # connect the wind resource to the wind technology
  - [site.solar_resource, solar, solar_resource_data]
plant:
  plant_life: 30
  simulation:
    n_timesteps: 8760
    dt: 3600
finance_parameters:
  finance_groups:
    finance_model: ProFastLCO
    model_inputs:
      params:
        analysis_start_year: 2032
        installation_time: 36  # months
        inflation_rate: 0.0  # 0 for nominal analysis
        discount_rate: 0.09  # nominal return based on 2024 ATB baseline workbook for land-based wind
        debt_equity_ratio: 2.62  # 2024 ATB uses 72.4% debt for land-based wind
        property_tax_and_insurance: 0.03  # percent of CAPEX estimated based on https://www.nlr.gov/docs/fy25osti/91775.pdf https://www.house.mn.gov/hrd/issinfo/clsrates.aspx
        total_income_tax_rate: 0.257  # 0.257 tax rate in 2024 atb baseline workbook, value here is based on federal (21%) and state in MN (9.8)
        capital_gains_tax_rate: 0.15  # H2FAST default
        sales_tax_rate: 0.07375  # total state and local sales tax in St. Louis County https://taxmaps.state.mn.us/salestax/
        debt_interest_rate: 0.07  # based on 2024 ATB nominal interest rate for land-based wind
        debt_type: Revolving debt  # can be "Revolving debt" or "One time loan". Revolving debt is H2FAST default and leads to much lower LCOH
        loan_period_if_used: 0  # H2FAST default, not used for revolving debt
        cash_onhand_months: 1  # H2FAST default
        admin_expense: 0.00  # percent of sales H2FAST default
      capital_items:
        depr_type: MACRS   # can be "MACRS" or "Straight line"
        depr_period: 5  # 5  years - for clean energy facilities as specified by the IRS MACRS schedule https://www.irs.gov/publications/p946#en_US_2020_publink1000107507
        refurb: [0.]
  finance_subgroups:
    # Upstream electricity finance group: levelized cost of the wind + solar
    # electricity. Its LCOE output feeds Approaches B and C below.
    electricity:
      commodity: electricity
      commodity_stream: electrical_load_demand  # use the total electricity output from the combiner for the finance calc
      technologies: [solar, battery]
  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025  # used to adjust modeled costs to target_dollar_year
    target_dollar_year: 2022
