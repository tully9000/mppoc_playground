name: technology_config
description: This plant produces electricity with wind, solar, natural gas and battery to meet a fixed electrical load demand, coordinated by the system-level controller (SLC).
technologies:
  solar:
    performance_model:
      model: PYSAMSolarPlantPerformanceModel
    cost_model:
      model: ATBUtilityPVCostModel
    model_inputs:
      performance_parameters:
        # pv_capacity_kWdc: 1944370.15213615
        pv_capacity_kWdc: 1900000.0
        dc_ac_ratio: 1.34
        create_model_from: new
        tilt_angle_func: lat-func
        pysam_options:
          SystemDesign:
            gcr: 0.3
            array_type: 2
            bifaciality: 0.65
            inv_eff: 96.0
            losses: 14.6
            module_type: 1
            azimuth: 180
            rotlim: 45
          SolarResource:
            albedo_default: 0.2
      cost_parameters:
        # 2024 NLR ATB, Solar - Utility PV, Resource Class 2, moderate, 2026 numbers
        capex_per_kWac: 1432.00
        opex_per_kWac_per_year: 20.00
        cost_year: 2022
  bat_combiner:
    performance_model:
      model: GenericCombinerPerformanceModel
    model_inputs:
      performance_parameters:
        commodity: electricity
        commodity_rate_units: kW  
  battery:
    performance_model:
      model: StoragePerformanceModel
    cost_model:
      model: ATBBatteryCostModel
    # Under SLC, the battery-level controller is a thin passthrough; SLC
    # decides discharge/charge set-points at the system level. Using
    # SimpleStorageOpenLoopController (mirrors examples/35 battery_with_controller).
    control_strategy:
      model: SimpleStorageOpenLoopController
    model_inputs:
      shared_parameters:
        commodity: electricity
        commodity_rate_units: kW
        max_charge_rate: 1000000.0  # kW, 1000 MW
        max_capacity: 19000000  # kWh
        # max_capacity: 9679084.421410604  # kWh, ~9.7 GWh
        demand_profile: 300000.0  # kW; unused by SimpleStorageOpenLoopController when set_demand_as_avg_commodity_in=false + SLC drives set_point
        # demand_profile: 1000000.0  # kW; unused by SimpleStorageOpenLoopController when set_demand_as_avg_commodity_in=false + SLC drives set_point
      performance_parameters:
        max_soc_fraction: 0.9
        min_soc_fraction: 0.1
        init_soc_fraction: 0.9
        round_trip_efficiency: 0.9
      control_parameters:
        set_demand_as_avg_commodity_in: false
      cost_parameters:
        # 2024 NLR ATB, Utility-Scale Battery Storage, moderate, 2026 numbers
        cost_year: 2022
        energy_capex: 297.00
        power_capex: 312.00
        opex_fraction: 0.025
  electrical_load_demand:
    performance_model:
      model: GenericDemandComponent
    model_inputs:
      performance_parameters:
        commodity: electricity
        commodity_rate_units: kW
        demand_profile: 300000  # 1 GW
        # demand_profile: 1000000  # 1 GW
